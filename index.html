<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Excel</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:40px;
        }

        h1{
            color:#333;
        }

        .archivo{
            background:white;
            padding:15px;
            margin:15px 0;
            border-radius:10px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        a{
            text-decoration:none;
            color:white;
            background:#28a745;
            padding:10px 15px;
            border-radius:5px;
            display:inline-block;
            margin-top:10px;
        }

        a:hover{
            background:#218838;
        }
    </style>
</head>
<body>

    <h1>Mi Portafolio de Excel</h1>

    <div class="archivo">
        <h3>Contabilidad Personal</h3>
        <p>Tablas dinámicas y gráficos.</p>

        <a href="archivos/Contabilidad_personal.xlsx" download>
            Descargar archivo Excel
        </a>
    </div>

    <div class="archivo">
        <h3>Control de Inventario</h3>
        <p>Sistema básico de inventario en Excel.</p>

        <a href="archivos/inventario.xlsx" download>
            Descargar Excel
        </a>
    </div>

</body>
</html>
